name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mandy
          POSTGRES_PASSWORD: mandy
          POSTGRES_DB: mandy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mandy -d mandy"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://mandy:mandy@localhost:5432/mandy
      TEST_DATABASE_URL: postgresql+asyncpg://mandy:mandy@localhost:5432/mandy_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app
      - name: Migrations round-trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=80
